<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Para ti ❤</title>
<style>
  :root { --rose: #AD1457; --rose2: #E91E63; --blush: #FCE4EC; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; overflow: hidden; font-family: Georgia, "Times New Roman", serif; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #fff 0%, #fdeef4 100%); }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.1s ease; pointer-events: none; }
  .slide.on { opacity: 1; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 10px 40px rgba(173, 20, 87, .15); border-radius: 6px; transform: scale(1); transition: transform 7s ease-out; }
  .slide.on img { transform: scale(1.03); }
  /* intro */
  #intro { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #fff; text-align: center; padding: 24px; transition: opacity .8s ease; }
  #intro.hide { opacity: 0; pointer-events: none; }
  #intro h1 { color: var(--rose); font-style: italic; font-size: clamp(34px, 9vw, 64px); }
  #intro p { color: #5D3A48; font-family: -apple-system, system-ui, sans-serif; font-size: 17px; }
  #intro button { border: 0; background: var(--rose2); color: #fff; font: 600 18px -apple-system, system-ui, sans-serif; padding: 16px 34px; border-radius: 999px; box-shadow: 0 8px 24px rgba(233, 30, 99, .35); cursor: pointer; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(1); } 45% { transform: scale(1.06); } }
  .big-heart { width: 96px; height: 96px; animation: beat 1.4s ease-in-out infinite; }
  #rotate { display: none; color: #b07a90; font: 14px -apple-system, system-ui, sans-serif; }
  @media (orientation: portrait) { #rotate { display: block; } }
  /* controles */
  #bar { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 5; display: flex; justify-content: center; gap: 6px; }
  #bar span { width: 7px; height: 7px; border-radius: 50%; background: #f3c1d3; transition: all .3s; }
  #bar span.on { width: 20px; border-radius: 4px; background: var(--rose2); }
  #music { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 6; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); box-shadow: 0 2px 10px rgba(0,0,0,.12); font-size: 20px; cursor: pointer; }
  .float { position: fixed; bottom: -40px; z-index: 4; pointer-events: none; color: var(--rose2); opacity: .7; animation: up linear forwards; }
  @keyframes up { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<button id="music" aria-label="Música" hidden>🎵</button>

<div id="intro">
  <svg class="big-heart" viewBox="-4 -8 108 108"><path fill="#E91E63" d="M50 88 C 20 65 0 48 0 28 C 0 12 12 0 27 0 C 37 0 45 6 50 14 C 55 6 63 0 73 0 C 88 0 100 12 100 28 C 100 48 80 65 50 88 Z"/></svg>
  <h1>Para ti, Jerson</h1>
  <p>Sube el volumen 🎶</p>
  <button id="go">Toca para abrir ❤</button>
  <p id="rotate">Se ve mejor con el celular de lado ↻</p>
</div>

<audio id="song" src="cancion.mp3" preload="auto" loop></audio>

<script>
  const TOTAL = 19;      // número de diapositivas en /slides
  const SECONDS = 7;     // segundos por diapositiva
  const stage = document.getElementById("stage"), bar = document.getElementById("bar");
  const song = document.getElementById("song"), music = document.getElementById("music");
  const slides = [];
  for (let i = 1; i <= TOTAL; i++) {
    const d = document.createElement("div"); d.className = "slide";
    const img = new Image(); img.alt = "Diapositiva " + i; img.src = "slides/" + String(i).padStart(2, "0") + ".jpg";
    d.appendChild(img); stage.appendChild(d); slides.push(d);
    bar.appendChild(document.createElement("span"));
  }
  let cur = -1, timer = null;
  function show(n) {
    n = (n + TOTAL) % TOTAL;
    slides.forEach((s, i) => s.classList.toggle("on", i === n));
    [...bar.children].forEach((s, i) => s.classList.toggle("on", i === n));
    cur = n;
    clearTimeout(timer); timer = setTimeout(() => show(cur + 1), SECONDS * 1000);
    for (let k = 0; k < 4; k++) setTimeout(heart, k * 450);
  }
  function heart() {
    const h = document.createElement("div"); h.className = "float"; h.textContent = "❤";
    h.style.left = Math.random() * 100 + "vw"; h.style.fontSize = 14 + Math.random() * 22 + "px";
    h.style.animationDuration = 5 + Math.random() * 4 + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 9500);
  }
  document.getElementById("go").onclick = () => {
    song.play().catch(() => {});
    document.getElementById("intro").classList.add("hide");
    music.hidden = false; show(0);
  };
  music.onclick = (e) => { e.stopPropagation(); if (song.paused) { song.play(); music.textContent = "🎵"; } else { song.pause(); music.textContent = "🔇"; } };
  // tocar la mitad izquierda = atrás, derecha = adelante; deslizar también
  stage.onclick = (e) => { if (cur < 0) return; show(e.clientX < innerWidth / 2 ? cur - 1 : cur + 1); };
  let x0 = null;
  stage.addEventListener("touchstart", (e) => (x0 = e.touches[0].clientX), { passive: true });
  stage.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { e.preventDefault(); show(dx < 0 ? cur + 1 : cur - 1); } x0 = null; });
  addEventListener("keydown", (e) => { if (cur < 0) return; if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
</script>
</body>
</html>
